services:
  postgres:
    image: postgres:17-alpine
    container_name: memora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - memora_pgdata:/var/lib/postgresql/data

volumes:
  memora_pgdata:
